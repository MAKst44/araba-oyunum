<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAK - Trafikten Kaç</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:white;
    overflow:hidden;
}

/* =========================
   MENÜ
========================= */

#menu{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top,#263b55 0%,#101722 45%,#05080c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.menuBox{
    width:min(92%,500px);
    padding:32px 25px;
    border-radius:28px;
    background:rgba(10,15,22,.92);
    border:2px solid rgba(255,255,255,.12);
    box-shadow:0 25px 70px rgba(0,0,0,.6);
    text-align:center;
}

.logo{
    font-size:68px;
    font-weight:1000;
    letter-spacing:8px;
    color:#fff;
    text-shadow:0 0 25px #00aaff;
}

.subtitle{
    margin-top:-5px;
    font-size:18px;
    color:#9edfff;
    margin-bottom:25px;
}

.menuTitle{
    font-size:22px;
    margin-bottom:15px;
}

.diffBtn{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:0;
    border-radius:15px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.diffBtn:hover{
    transform:scale(1.03);
}

.easy{
    background:#168b45;
}

.medium{
    background:#b47700;
}

.hard{
    background:#b72a2a;
}

.stats{
    margin-top:22px;
    padding:14px;
    background:rgba(255,255,255,.06);
    border-radius:15px;
    color:#ddd;
}

/* =========================
   GARAGE
========================= */

#garage{
    display:none;
    position:fixed;
    inset:0;
    z-index:900;
    background:#10151b;
    overflow:auto;
    padding:25px;
}

.garageTitle{
    text-align:center;
    font-size:35px;
    font-weight:900;
    margin-bottom:20px;
}

.garageGrid{
    max-width:950px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:15px;
}

.garageCard{
    background:#1b242e;
    border:1px solid #34404d;
    border-radius:18px;
    padding:14px;
    text-align:center;
    cursor:pointer;
}

.garageCard.selected{
    border:3px solid #00bfff;
}

.garageCar{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.garageCar svg{
    width:90px;
    height:140px;
}

.garageName{
    font-weight:bold;
    margin:5px;
}

.garagePrice{
    color:#ffd43b;
}

.backBtn{
    display:block;
    margin:25px auto;
    padding:12px 25px;
    border:0;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:17px;
}

/* =========================
   OYUN
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#82c9ed;
}

/* gökyüzü */

#sky{
    position:absolute;
    inset:0 0 58% 0;
    background:linear-gradient(#55b8ed,#b9e7ff);
}

/* deniz */

#sea{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:calc(50% - 155px);
    background:
        repeating-linear-gradient(
            0deg,
            #138ec2 0px,
            #138ec2 10px,
            #25a9d6 11px,
            #25a9d6 15px
        );
    z-index:1;
}

/* orman */

#forest{
    position:absolute;
    right:0;
    top:0;
    bottom:0;
    width:calc(50% - 155px);
    background:#1f7137;
    z-index:1;
    overflow:hidden;
}

/* yol */

#road{
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:310px;
    background:
        linear-gradient(
            90deg,
            #24282d 0%,
            #3b4046 4%,
            #30343a 7%,
            #30343a 93%,
            #3b4046 96%,
            #24282d 100%
        );
    z-index:5;
    overflow:hidden;
}

.roadEdge{
    position:absolute;
    top:0;
    bottom:0;
    width:5px;
    background:#eee;
    z-index:20;
}

.roadEdge.left{
    left:10px;
}

.roadEdge.right{
    right:10px;
}

/*
   ŞERİT ÇİZGİLERİ
   SABİT - YANIP SÖNMEZ
*/

.laneLine{
    position:absolute;
    top:0;
    bottom:0;
    width:5px;
    background:
        repeating-linear-gradient(
            to bottom,
            white 0px,
            white 65px,
            transparent 65px,
            transparent 125px
        );
    opacity:.9;
    z-index:7;
}

#line1{
    left:103px;
}

#line2{
    left:202px;
}

/* ağaçlar */

.tree{
    position:absolute;
    width:45px;
    height:70px;
    z-index:3;
}

.tree .trunk{
    position:absolute;
    bottom:0;
    left:19px;
    width:9px;
    height:28px;
    background:#684027;
    border-radius:5px;
}

.tree .leaf{
    position:absolute;
    left:3px;
    top:0;
    width:40px;
    height:45px;
    background:#11652e;
    border-radius:50%;
    box-shadow:14px 5px 0 #1d843c,-8px 12px 0 #197438;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    z-index:200;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.hudBox{
    background:rgba(0,0,0,.65);
    border:1px solid rgba(255,255,255,.15);
    padding:10px 13px;
    border-radius:13px;
    min-width:125px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.hudLine{
    margin:2px 0;
    font-size:15px;
    font-weight:bold;
}

#score{
    color:#ffd43b;
}

#money{
    color:#6dff8b;
}

#lives{
    color:#ff6565;
}

/* =========================
   ARAÇ
========================= */

.car{
    position:absolute;
    width:58px;
    height:105px;
    z-index:50;
    transform:translateX(-50%);
    filter:drop-shadow(0 7px 4px rgba(0,0,0,.35));
}

.car svg{
    width:100%;
    height:100%;
    display:block;
}

.player{
    z-index:100;
}

/* =========================
   POLİS
========================= */

.police{
    position:absolute;
    width:61px;
    height:112px;
    z-index:80;
    transform:translateX(-50%);
    filter:drop-shadow(0 7px 5px rgba(0,0,0,.5));
}

.police svg{
    width:100%;
    height:100%;
}

/* =========================
   BONUS
========================= */

.bonus{
    position:absolute;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    z-index:70;
    box-shadow:0 0 18px rgba(255,255,255,.4);
}

/* =========================
   POLİS UYARISI
========================= */

#policeAlert{
    position:absolute;
    left:50%;
    bottom:95px;
    transform:translateX(-50%);
    min-width:280px;
    text-align:center;
    padding:13px 20px;
    border-radius:15px;
    background:rgba(170,0,0,.9);
    border:2px solid #ff4b4b;
    z-index:300;
    display:none;
    animation:alertFlash .55s infinite alternate;
}

@keyframes alertFlash{
    from{
        opacity:.45;
    }
    to{
        opacity:1;
    }
}

/* =========================
   KONTROLLER
========================= */

#controls{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:250;
    display:flex;
    gap:10px;
}

.controlBtn{
    width:65px;
    height:55px;
    border:0;
    border-radius:16px;
    background:rgba(0,0,0,.72);
    color:white;
    font-size:25px;
    font-weight:bold;
    border:1px solid rgba(255,255,255,.15);
}

.controlBtn:active{
    transform:scale(.94);
}

.special{
    font-size:14px;
}

/* =========================
   OVERLAY
========================= */

#overlay{
    position:absolute;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
}

.overlayBox{
    width:min(90%,430px);
    background:#151b22;
    border:2px solid #394754;
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.overlayTitle{
    font-size:38px;
    font-weight:1000;
    margin-bottom:15px;
}

.overlayText{
    font-size:20px;
    margin-bottom:20px;
}

.overlayBtn{
    width:100%;
    margin:6px 0;
    padding:14px;
    border:0;
    border-radius:13px;
    background:#087fce;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* =========================
   YAĞMUR
========================= */

.rain{
    position:absolute;
    inset:0;
    z-index:180;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            110deg,
            transparent 0px,
            transparent 8px,
            rgba(255,255,255,.18) 9px,
            transparent 10px
        );
    animation:rainMove .35s linear infinite;
}

@keyframes rainMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:50px 100px;
    }
}

/* =========================
   LEVEL
========================= */

#levelBadge{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.65);
    padding:7px 14px;
    border-radius:12px;
    z-index:220;
    font-weight:bold;
}

/* =========================
   MOBİL
========================= */

@media(max-width:600px){

    #road{
        width:270px;
    }

    #sea,
    #forest{
        width:calc(50% - 135px);
    }

    #line1{
        left:90px;
    }

    #line2{
        left:175px;
    }

    .car{
        width:52px;
        height:96px;
    }

    .police{
        width:55px;
        height:103px;
    }

    .hudBox{
        min-width:auto;
        padding:7px 9px;
    }

    .hudLine{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENÜ
========================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">MAK</div>

        <div class="subtitle">
            🚗 TRAFİKTEN KAÇ 🚓
        </div>

        <div class="menuTitle">
            Zorluk seç
        </div>

        <button class="diffBtn easy" onclick="startGame('easy')">
            🟢 KOLAY
        </button>

        <button class="diffBtn medium" onclick="startGame('medium')">
            🟡 ORTA
        </button>

        <button class="diffBtn hard" onclick="startGame('hard')">
            🔴 ZOR
        </button>

        <div class="stats">
            💰 Para: <b id="menuMoney">0</b><br>
            🏆 Rekor: <b id="menuHigh">0</b>
        </div>

        <button class="diffBtn" style="background:#4c5968" onclick="openGarage()">
            🚘 GARAJ
        </button>

    </div>
</div>

<!-- =========================
     GARAJ
========================= -->

<div id="garage">

    <div class="garageTitle">
        🚘 MAK GARAJI
    </div>

    <div class="garageGrid" id="garageGrid"></div>

    <button class="backBtn" onclick="closeGarage()">
        ⬅️ Menüye dön
    </button>

</div>

<!-- =========================
     OYUN
========================= -->

<div id="game">

    <div id="sky"></div>

    <div id="sea"></div>

    <div id="forest"></div>

    <div id="road">

        <div class="roadEdge left"></div>
        <div class="roadEdge right"></div>

        <!-- SABİT ŞERİTLER -->
        <div class="laneLine" id="line1"></div>
        <div class="laneLine" id="line2"></div>

    </div>

    <div id="hud">

        <div class="hudBox">
            <div class="hudLine">🏆 <span id="score">0</span></div>
            <div class="hudLine">❤️ <span id="lives">5</span></div>
            <div class="hudLine">💰 <span id="money">0</span></div>
        </div>

        <div class="hudBox">
            <div class="hudLine">🎯 <span id="target">100</span></div>
            <div class="hudLine">⚡ NİTRO: <span id="nitroText">HAZIR</span></div>
            <div class="hudLine">🛡️ KALKAN: <span id="shieldText">HAZIR</span></div>
        </div>

    </div>

    <div id="levelBadge">
        MAK Lv.1
    </div>

    <div id="policeAlert"></div>

    <div id="controls">

        <button class="controlBtn" onclick="moveLeft()">⬅️</button>

        <button class="controlBtn special" onclick="useNitro()">
            ⚡<br>NİTRO
        </button>

        <button class="controlBtn special" onclick="useShield()">
            🛡️<br>KALKAN
        </button>

        <button class="controlBtn" onclick="moveRight()">➡️</button>

    </div>

    <div id="overlay">

        <div class="overlayBox">

            <div class="overlayTitle" id="overlayTitle">
                OYUN BİTTİ
            </div>

            <div class="overlayText" id="overlayText"></div>

            <button class="overlayBtn" onclick="restartGame()">
                🔄 Tekrar Oyna
            </button>

            <button class="overlayBtn" onclick="backToMenu()">
                🏠 Ana Menü
            </button>

        </div>

    </div>

</div>

<script>

/* =====================================================
   AYARLAR
===================================================== */

const settings = {

    easy:{
        speed:3.0,
        spawn:1750,
        police:11000,
        target:100
    },

    medium:{
        speed:4.0,
        spawn:1450,
        police:8000,
        target:500
    },

    hard:{
        speed:5.0,
        spawn:1200,
        police:6000,
        target:1000
    }

};


/* =====================================================
   OYUN DURUMU
===================================================== */

let difficulty="easy";

let currentLane=1;

let lives=5;

let score=0;

let money=Number(localStorage.getItem("makMoney") || 0);

let highScore=Number(localStorage.getItem("makHighScore") || 0);

let normalGameOverCount=
    Number(localStorage.getItem("makGameOverCount") || 0);

let policeHits=0;

let playing=false;

let paused=false;

let nitroActive=false;

let shieldActive=false;

let traffic=[];

let policeCars=[];

let bonuses=[];

let timers=[];

let animationFrame=null;

let lastTime=0;

let scoreTimer=0;

let trafficTimer=0;

let policeTimer=0;

let bonusTimer=0;

let selectedCar=
    localStorage.getItem("makSelectedCar") || "blue";

let missionProgress=0;

let missionTarget=20;

let missionType="cars";

let gameOverReason="normal";


/* =====================================================
   ŞERİT KONUMU
===================================================== */

const lanePositions=[

    31,
    111,
    191

];


/* =====================================================
   ARAÇLAR
   YÜKLENEN GÖRSELLERDEKİ STİLLERDEN ESİNLENEN
   ÖZGÜN SVG TASARIMLARI
===================================================== */

const vehicleStyles={

    red:{
        color:"#ef3340",
        roof:"#c91f30",
        stripe:"#9e1624",
        type:"sport"
    },

    silver:{
        color:"#dce2e7",
        roof:"#b9c3cb",
        stripe:"#8b969f",
        type:"normal"
    },

    pink:{
        color:"#ed3b91",
        roof:"#c91c70",
        stripe:"#a7135a",
        type:"sport"
    },

    purple:{
        color:"#733de0",
        roof:"#5525a7",
        stripe:"#421d85",
        type:"sport"
    },

    blue:{
        color:"#1574d1",
        roof:"#0b4e99",
        stripe:"#073b78",
        type:"sport"
    },

    dark:{
        color:"#566575",
        roof:"#3f4c59",

        type:"normal"
    },

    lightpink:{
        color:"#ed6eb0",

    },

    navy:{

    },

    slate:{

    policeblue:{
        color:"#294f82",

    },

    yellow:{
        color:"#f5bf2f",
        roof:"#d99700",
        stripe:"#b77800",
        type:"sport"
    },

    green:{
        color:"#65c92f",
        roof:"#42a51c",
        stripe:"#2e7c12",
        type:"sport"
    },

    brown:{
        color:"#c96f45",
        roof:"#9d4d2e",
        stripe:"#783821",
        type:"normal"
    },

    orange:{
        color:"#f39424",
        roof:"#d36c0b",
        stripe:"#a95008",
        type:"sport"
    },

    cyan:{
        color:"#48b8d8",
        roof:"#238ba7",
        stripe:"#176c81",
        type:"sport"
    },

    mint:{
        color:"#67cfae",
        roof:"#43aa8e",
        stripe:"#2f806a",
        type:"sport"
    },

    black:{
        color:"#252c35",
        roof:"#11161b",
        stripe:"#090c10",
        type:"normal"
    }

};


/* =====================================================
   ARAÇ TİPLERİ
===================================================== */

const vehicleList=[

    "red",
    "silver",
    "pink",
    "purple",
    "blue",
    "dark",
    "lightpink",
    "navy",
    "slate",
    "yellow",
    "green",
    "brown",
    "orange",
    "cyan",
    "mint",
    "black"

];


/* =====================================================
   GARAJ ARAÇLARI
===================================================== */

const garageCars=[

    {
        id:"blue",
        name:"MAK Blue",
        color:"#1574d1",
        price:0
    },

    {
        id:"red",

        color:"#ef3340",
        price:100
    },

    {

        color:"#733de0",

    },

    {
        id:"yellow",
        name:"MAK Gold",
        color:"#f5bf2f",
        price:300
    },

    {
        id:"green",

        color:"#65c92f",
        price:400
    },

    {
        id:"cyan",
        name:"MAK Sport",
        color:"#48b8d8",
        price:500
    }

];


/* =====================================================
   SVG ARAÇ OLUŞTURMA
===================================================== */

function vehicleSVG(style,player=false){

    const s=vehicleStyles[style] || vehicleStyles.blue;

    const color=s.color;
    const roof=s.roof;
    const stripe=s.stripe;

    const playerGlow=player
        ? `<filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>`
        : "";

    const stripes=
        (s.type==="sport")
        ?
        `<path d="M27 10 L31 95"
               stroke="${stripe}"
               stroke-width="4"
               opacity=".75"/>
         <path d="M34 10 L38 95"
               stroke="${stripe}"
               stroke-width="2"
               opacity=".55"/>`
        :
        "";

    return `
    <svg viewBox="0 0 68 125"
         xmlns="http://www.w3.org/2000/svg">

        ${playerGlow}

        <!-- gölge -->
        <ellipse
            cx="34"
            cy="117"
            rx="23"
            ry="5"
            fill="rgba(0,0,0,.35)"
        />

        <!-- sol teker -->
        <rect
            x="2"
            y="29"
            width="9"
            height="25"
            rx="4"
            fill="#16191c"
        />

        <rect
            x="2"
            y="72"
            width="9"
            height="25"
            rx="4"
            fill="#16191c"
        />

        <!-- sağ teker -->
        <rect
            x="57"
            y="29"
            width="9"
            height="25"
            rx="4"
            fill="#16191c"
        />

        <rect
            x="57"
            y="72"
            width="9"
            height="25"
            rx="4"
            fill="#16191c"
        />

        <!-- ana gövde -->
        <path
            d="M19 7
               Q34 0 49 7
               Q56 15 57 31
               L61 99
               Q59 113 50 117
               Q34 122 18 117
               Q9 113 7 99
               L11 31
               Q12 15 19 7Z"
            fill="${color}"
            stroke="#20252a"
            stroke-width="1.5"
            ${player ? `filter="url(#glow)"` : ""}
        />

        <!-- tavan -->
        <path
            d="M18 19
               Q34 10 50 19
               L54 40
               Q34 47 14 40Z"
            fill="${roof}"
        />

        <!-- ön cam -->
        <path
            d="M17 21
               Q34 14 51 21
               L53 36
               Q34 41 15 36Z"
            fill="#202d3d"
        />

        <!-- cam yansıması -->
        <path
            d="M21 21 L27 19 L20 32"
            stroke="#cde9ff"
            stroke-width="2"
            opacity=".55"
        />

        <!-- arka cam -->
        <path
            d="M15 78
               Q34 73 53 78
               L50 94
               Q34 99 18 94Z"
            fill="#253445"
        />

        ${stripes}

        <!-- kaput -->
        <path
            d="M14 42 Q34 47 54 42 L57 62 Q34 68 11 62Z"
            fill="${color}"
        />

        <!-- farlar -->

function openGarage(){

    menu.style.display="none";

    garage.style.display="block";

}


function closeGarage(){

    garage.style.display="none";

    menu.style.display="flex";

}


function renderGarage(){

    const grid=document.getElementById("garageGrid");

    grid.innerHTML="";

    garageCars.forEach(car=>{

        const card=document.createElement("div");

        card.className=
            "garageCard " +
            (selectedCar===car.id ? "selected" : "");

        card.innerHTML=`

            <div class="garageCar">
                ${vehicleSVG(car.id)}
            </div>

            <div class="garageName">
                ${car.name}

                    ? "ÜCRETSİZ"

                }

        card.onclick=()=>selectGarageCar(car);

        grid.appendChild(card);

    });

}


function selectGarageCar(car){

    if(selectedCar===car.id){

        return;

    }

    if(car.price>money){

        alert(
            "Bu aracı almak için "+
            car.price+
            " paran olması gerekiyor!"
        );

        return;

    }

    if(car.price>0){

        money-=car.price;

        localStorage.setItem(
            "makMoney",
            money
        );

    }

    selectedCar=car.id;

    localStorage.setItem(
        "makSelectedCar",
        selectedCar
    );

    renderGarage();

}

function startGame(levelName){

    difficulty=levelName;

    currentLane=1;

    lives=5;

    score=0;

    policeHits=0;

    playing=true;

    paused=false;

    nitroActive=false;

    shieldActive=false;

    traffic=[];

    policeCars=[];

    bonuses=[];

    missionProgress=0;

    gameOverReason="normal";

    scoreTimer=0;

    trafficTimer=0;

    policeTimer=0;

    bonusTimer=0;

    clearAllObjects();

    menu.style.display="none";

    garage.style.display="none";

    game.style.display="block";

    overlay.style.display="none";

    targetEl.textContent=

/* =====================================================
   ORTAM
===================================================== */

function createEnvironment(){

    const oldTrees=
        document.querySelectorAll(".tree");

    oldTrees.forEach(t=>t.remove());

    for(let i=0;i<35;i++){

        const tree=document.createElement("div");

        tree.className="tree";

        const side=
            Math.random()<.5
            ? "left"
            : "right";

        const roadHalf=155;

        let x;

        if(side==="left"){

            x=
                Math.random()*
                Math.max(
                    20,
                    window.innerWidth/2-roadHalf-50
                );

        }else{

            x=
                window.innerWidth/2+
                roadHalf+
                Math.random()*
                Math.max(
                    20,
                    window.innerWidth/2-roadHalf-50
                );

        }

        const y=
            Math.random()*
            window.innerHeight;

        tree.style.left=x+"px";

        tree.style.top=y+"px";

        tree.style.transform=
            `scale(${.7+Math.random()*.7})`;

        tree.innerHTML=`

            <div class="trunk"></div>
            <div class="leaf"></div>

        `;

        game.appendChild(tree);

    }

}


/* =====================================================
   OYUNCU
===================================================== */

function createPlayer(){

    const old=
        document.getElementById("player");

    if(old){

        old.remove();

    }

    const player=document.createElement("div");

    player.id="player";

    player.className="car player";

    player.innerHTML=
        vehicleSVG(selectedCar,true);

    player.style.left=
        lanePositions[currentLane]+"px";

    player.style.bottom="125px";

    player.dataset.lane=currentLane;

    document.getElementById("road").appendChild(player);

}


/* =====================================================
   ŞERİT DEĞİŞTİRME
===================================================== */

function moveLeft(){

    if(!playing || paused){

        return;

    }

    if(currentLane>0){

        currentLane--;

        updatePlayerLane();

    }

}


function moveRight(){

    if(!playing || paused){

        return;

    }

    if(currentLane<2){

        currentLane++;

        updatePlayerLane();

    }

}


function updatePlayerLane(){

    const player=
        document.getElementById("player");

    if(!player){

        return;

    }

    player.style.left=
        lanePositions[currentLane]+"px";

    player.dataset.lane=currentLane;

}


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){

        moveLeft();

    }

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){

        moveRight();

    }

    if(e.key===" "){

        e.preventDefault();

        useNitro();

    }

    if(e.key.toLowerCase()==="s"){

        useShield();

    }

});


/* =====================================================
   TRAFİK OLUŞTUR
===================================================== */

function spawnTraffic(){

    if(!playing || paused){

        return;

    }

    const lanes=[
        0,
        1,
        2
    ];

    lanes.sort(
        ()=>Math.random()-.5
    );

    let chosenLane=null;

    for(const lane of lanes){

        const blocked=
            traffic.some(car=>
                car.lane===lane &&
                car.y<280
            );

        if(!blocked){

            chosenLane=lane;

            break;

        }

    }

    if(chosenLane===null){

        return;

    }

    const style=
        vehicleList[
            Math.floor(
                Math.random()*vehicleList.length
            )
        ];

    const typeRoll=Math.random();

    let vehicleType="car";

    if(typeRoll<.08){

        vehicleType="bus";

    }else if(typeRoll<.15){

        vehicleType="truck";

    }

    createTraffic(
        chosenLane,
        style,
        vehicleType
    );

}


/* =====================================================
   TRAFİK ARACI
===================================================== */

function createTraffic(lane,style,type="car"){

    const el=document.createElement("div");

    el.className="car";

    let big=false;

    if(type==="bus" || type==="truck"){

        big=true;

        el.style.width="58px";

        el.style.height="112px";

        el.innerHTML=
            largeVehicleSVG(
                vehicleStyles[style].color
            );

    }else{

        el.innerHTML=
            vehicleSVG(style);

    }

    el.style.left=
        lanePositions[lane]+"px";

    el.style.top="-150px";

    document.getElementById("road")
        .appendChild(el);

    traffic.push({

        el,
        lane,
        y:-150,
        speed:
            settings[difficulty].speed *
            (0.9+Math.random()*.3),
        type,
        big

    });

}

/* =====================================================
   NİTRO
===================================================== */

function useNitro(){

    if(!playing || paused || nitroActive){

        return;

    }

    nitroActive=true;

    updateHUD();

    setTimeout(()=>{

        nitroActive=false;

        updateHUD();

    },3000);

}


/* =====================================================
   KALKAN
===================================================== */

function useShield(){

    if(!playing || paused || shieldActive){

        return;

    }

    shieldActive=true;

    updateHUD();

    setTimeout(()=>{

        shieldActive=false;

        updateHUD();

    },5000);

}


/* =====================================================
   ÇARPIŞMA KONTROLÜ
===================================================== */

function collision(a,b){

    const ar=a.getBoundingClientRect();

    const br=b.getBoundingClientRect();

    return !(
        ar.right<br.left ||
        ar.left>br.right ||
        ar.bottom<br.top ||
        ar.top>br.bottom
    );

}


/* =====================================================
   TRAFİK HAREKETİ
===================================================== */

function moveTraffic(delta){

    const speedMultiplier=
        nitroActive ? 1.55 : 1;

    for(let i=traffic.length-1;i>=0;i--){

        const car=traffic[i];

        car.y +=
            car.speed *
            speedMultiplier *
            delta/16;

        car.el.style.top=
            car.y+"px";

        const player=
            document.getElementById("player");

        if(
            player &&
            collision(car.el,player)
        ){

            handleTrafficCollision(car,i);

            continue;

        }

        if(car.y>window.innerHeight+180){

            car.el.remove();

            traffic.splice(i,1);

            missionProgress++;

        }

    }

}


/* =====================================================
   NORMAL ARAÇ ÇARPIŞMASI
===================================================== */

function handleTrafficCollision(car,index){

    car.el.remove();

    traffic.splice(index,1);

    if(shieldActive){

        return;

    }

    lives--;

    updateHUD();

    /*
      OYUN DURMUYOR.
    */

    if(lives<=0){

        endGame("normal");

    }

}


/* =====================================================
   POLİS HAREKETİ
===================================================== */

function movePolice(delta){

    for(let i=policeCars.length-1;i>=0;i--){

        const police=policeCars[i];

        police.y -=
            police.speed *
            delta/16;

        police.el.style.top=
            police.y+"px";

        const player=
            document.getElementById("player");

        if(
            player &&
            collision(police.el,player)
        ){

            handlePoliceCollision(police,i);

            return;

        }

        if(police.y<-180){

            police.el.remove();

            policeCars.splice(i,1);

            hidePoliceAlert();

        }

    }

}


/* =====================================================
   POLİS ÇARPIŞMASI
===================================================== */

function handlePoliceCollision(police,index){

    police.el.remove();

    policeCars.splice(index,1);

    hidePoliceAlert();

    policeHits++;

    if(policeHits===1){

        paused=true;

        showOverlay(
            "🚓 DİKKAT!",
            "Polis seni yakaladı!<br><br>"+
            "Bir daha yakalanırsan oyun biter."
        );

    }else{

        endGame("police");

    }

}


/* =====================================================
   BONUS HAREKETİ
===================================================== */

function moveBonuses(delta){

    const player=
        document.getElementById("player");

    if(!player){

        return;

    }

    for(let i=bonuses.length-1;i>=0;i--){

        const bonus=bonuses[i];

        bonus.y +=
            bonus.speed*
            delta/16;

        bonus.el.style.top=
            bonus.y+"px";

        if(collision(bonus.el,player)){

            collectBonus(bonus);

            bonus.el.remove();

            bonuses.splice(i,1);

            continue;

        }

        if(bonus.y>window.innerHeight+80){

            bonus.el.remove();

            bonuses.splice(i,1);

        }

    }

}


/* =====================================================
   BONUS TOPLA
===================================================== */

function collectBonus(bonus){

    if(bonus.type==="coin"){

        money+=10;

        localStorage.setItem(
            "makMoney",
            money
        );

    }

    if(bonus.type==="nitro"){

        nitroActive=false;

        setTimeout(
            useNitro,
            50
        );

    }

    if(bonus.type==="shield"){

        shieldActive=false;

        setTimeout(
            useShield,
            50
        );

    }

    updateHUD();

}


/* =====================================================
   SKOR
===================================================== */

function updateScore(delta){

    scoreTimer+=delta;

    if(scoreTimer>=1800){

        scoreTimer=0;

        const add=
            3+
            Math.floor(
                Math.random()*4
            );

        score+=add;

        money+=1;

        if(score>highScore){

            highScore=score;

            localStorage.setItem(
                "makHighScore",
                highScore
            );

        }

        localStorage.setItem(
            "makMoney",
            money
        );

        updateHUD();

        if(
            score>=settings[difficulty].target
        ){

            endGame("win");

        }

    }

}


/* =====================================================
   OYUN DÖNGÜSÜ
===================================================== */

function gameLoop(time){

    if(!playing){

        return;

    }

    if(paused){

        animationFrame=
            requestAnimationFrame(gameLoop);

        return;

    }

    const delta=
        Math.min(
            time-lastTime,
            40
        );

    lastTime=time;

    trafficTimer+=delta;

    policeTimer+=delta;

    bonusTimer+=delta;

    if(
        trafficTimer>=
        settings[difficulty].spawn
    ){

        trafficTimer=0;

        spawnTraffic();

    }

    if(
        policeTimer>=
        settings[difficulty].police
    ){

        policeTimer=0;

        spawnPolice();

    }

    if(bonusTimer>=6500){

        bonusTimer=0;

        spawnBonus();

    }

    moveTraffic(delta);

    movePolice(delta);

    moveBonuses(delta);

    updateScore(delta);

    animationFrame=
        requestAnimationFrame(gameLoop);

}


/* =====================================================
   OVERLAY
===================================================== */

function showOverlay(title,text){

    overlay.style.display="flex";

    document.getElementById(
        "overlayTitle"
    ).innerHTML=title;

    document.getElementById(
        "overlayText"
    ).innerHTML=text;

}


/* =====================================================
   OYUNU BİTİR
===================================================== */

function endGame(reason){

    if(!playing){

        return;

    }

    playing=false;

    gameOverReason=reason;

    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame=null;

    }

    hidePoliceAlert();

    let title="";

    let text="";

    if(reason==="police"){

        title="⛓️ MÜEBBET ⛓️";

        text=
            "🚓 Polis seni ikinci kez yakaladı!<br><br>"+
            "Skor: <b>"+score+"</b><br>"+
            "💰 Para: <b>"+money+"</b><br><br>"+
            "🔗⛓️🔗";

    }

    else if(reason==="win"){

        title="🏆 TEBRİKLER!";

        text=
            "<b>MAK seni tebrik ediyor! 🏆</b><br><br>"+
            "Hedefi tamamladın!<br><br>"+
            "Skor: <b>"+score+"</b><br>"+
            "💰 Para: <b>"+money+"</b>";

    }

    else{

        normalGameOverCount++;

        localStorage.setItem(
            "makGameOverCount",
            normalGameOverCount
        );

        /*
          1,3,5... :
          Ehliyeti kasaptan mı aldın?

          2,4,6... :
          Acemi misin?
        */

        if(normalGameOverCount%2===1){

            title="😂 OYUN BİTTİ";

            text=
                "Ehliyeti kasaptan mı aldın? 😂<br><br>"+
                "Skor: <b>"+score+"</b><br>"+
                "💰 Para: <b>"+money+"</b>";

        }else{

            title="😂 OYUN BİTTİ";

            text=
                "Acemi misin? 😂<br><br>"+
                "Skor: <b>"+score+"</b><br>"+
                "💰 Para: <b>"+money+"</b>";

        }

    }

    showOverlay(
        title,
        text
    );

    updateMenu();

}


/* =====================================================
   TÜM OBJELERİ TEMİZLE
===================================================== */

function clearAllObjects(){

    traffic.forEach(car=>{

        if(car.el){

            car.el.remove();

        }

    });

    policeCars.forEach(police=>{

        if(police.el){

            police.el.remove();

        }

    });

    bonuses.forEach(bonus=>{

        if(bonus.el){

            bonus.el.remove();

        }

    });

    traffic=[];

    policeCars=[];

    bonuses=[];

    const player=
        document.getElementById("player");

    if(player){

        player.remove();

    }

}


/* =====================================================
   DOKUNMATİK HAREKET
===================================================== */

let touchStartX=0;

document.addEventListener(
    "touchstart",
    e=>{

        touchStartX=
            e.changedTouches[0].screenX;

    },
    {passive:true}
);

document.addEventListener(
    "touchend",
    e=>{

        const endX=
            e.changedTouches[0].screenX;

        const diff=
            endX-touchStartX;

        if(Math.abs(diff)<35){

            return;

        }

        if(diff<0){

            moveLeft();

        }else{

            moveRight();

        }

    },
    {passive:true}
);


/* =====================================================
   OYUN DEVAM
===================================================== */

overlay.addEventListener(
    "click",
    e=>{

        if(
            e.target.tagName==="BUTTON" &&
            e.target.textContent.includes("Tekrar")
        ){

            overlay.style.display="none";

        }

    }
);


/* =====================================================
   İLK YÜKLEME
===================================================== */

updateMenu();

</script>
