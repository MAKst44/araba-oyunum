<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAK - Trafikten Kaç</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button {
    cursor: pointer;
    border: none;
}

/* MENÜ */

#menu {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #111827, #020617);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.menuBox {
    width: 90%;
    max-width: 420px;
    padding: 30px;
    background: #1f2937;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 30px #000;
}

.menuBox h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

.menuBox p {
    margin-bottom: 20px;
    color: #ccc;
}

.difficulty {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.easy {
    background: #16a34a;
}

.medium {
    background: #d97706;
}

.hard {
    background: #dc2626;
}

/* OYUN */

#game {
    position: relative;
    width: 430px;
    height: 100vh;
    max-height: 850px;
    margin: auto;
    overflow: hidden;
    background: #555;
}

/* DENİZ */

#sea {
    position: absolute;
    left: 0;
    top: 0;
    width: 75px;
    height: 100%;
    background:
        repeating-linear-gradient(
            0deg,
            #168dbb 0px,
            #168dbb 18px,
            #4dbbdd 20px,
            #4dbbdd 24px
        );
}

/* ORMAN */

#forest {
    position: absolute;
    right: 0;
    top: 0;
    width: 75px;
    height: 100%;
    background: #34752d;
}

.tree {
    position: absolute;
    width: 35px;
    height: 55px;
}

.tree::before {
    content: "";
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #155e24;
    box-shadow: 15px 8px 0 #23752e;
}

.tree::after {
    content: "";
    position: absolute;
    left: 16px;
    top: 35px;
    width: 7px;
    height: 25px;
    background: #70452b;
}

/* YOL */

#road {
    position: absolute;
    left: 75px;
    width: 280px;
    height: 100%;
    background: #333;
    border-left: 6px solid white;
    border-right: 6px solid white;
}

/* ŞERİT ÇİZGİLERİ */

.line {
    position: absolute;
    top: 0;
    width: 5px;
    height: 70px;
    background: white;
}

#line1 {
    left: 91px;
}

#line2 {
    left: 182px;
}

/* HUD */

#hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
}

.hud {
    padding: 10px 14px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    font-weight: bold;
}

/* ARABA */

.car {
    position: absolute;
    width: 52px;
    height: 100px;
    z-index: 20;
}

.carBody {
    position: absolute;
    left: 5px;
    top: 5px;
    width: 42px;
    height: 90px;
    border-radius: 12px;
    background: #1976d2;
    box-shadow: 0 5px 8px rgba(0,0,0,.5);
}

.window {
    position: absolute;
    left: 12px;
    top: 17px;
    width: 28px;
    height: 25px;
    background: #345a6b;
    border-radius: 6px;
    z-index: 2;
}

.rearWindow {
    position: absolute;
    left: 12px;
    bottom: 15px;
    width: 28px;
    height: 17px;
    background: #253f4b;
    border-radius: 5px;
    z-index: 2;
}

.light {
    position: absolute;
    width: 7px;
    height: 9px;
    background: yellow;
    top: 7px;
    z-index: 3;
}

.light.left {
    left: 9px;
}

.light.right {
    right: 9px;
}

.tail {
    position: absolute;
    width: 7px;
    height: 8px;
    background: red;
    bottom: 7px;
    z-index: 3;
}

.tail.left {
    left: 9px;
}

.tail.right {
    right: 9px;
}

/* ARABA RENKLERİ */

.red .carBody {
    background: #d71919;
}

.blue .carBody {
    background: #1769d1;
}

.gray .carBody {
    background: #777;
}

.black .carBody {
    background: #111;
}

.white .carBody {
    background: #ddd;
}

.green .carBody {
    background: #16823b;
}

/* SUV */

.suv .carBody {
    height: 95px;
    border-radius: 9px;
}

/* OTOBÜS */

.bus {
    width: 62px;
    height: 120px;
}

.bus .carBody {
    width: 52px;
    height: 112px;
    background: #d32f2f;
    border-radius: 6px;
}

.bus .window {
    width: 38px;
    height: 45px;
    left: 12px;
    background: #304e5b;
}

/* KAMYON */

.truck {
    width: 62px;
    height: 120px;
}

.truck .carBody {
    width: 52px;
    height: 112px;
    background: #ddd;
    border-radius: 6px;
}

.truck .window {
    width: 36px;
    left: 13px;
}

/* POLİS */

.police .carBody {
    background: linear-gradient(
        90deg,
        #172554 0%,
        #f5f5f5 30%,
        #f5f5f5 70%,
        #172554 100%
    );
}

.policeLight {
    position: absolute;
    left: 11px;
    top: 3px;
    width: 30px;
    height: 7px;
    background: linear-gradient(
        90deg,
        red 50%,
        blue 50%
    );
    z-index: 5;
}

/* OYUNCU */

#player {
    left: 187px;
    bottom: 45px;
}

/* KONTROLLER */

#controls {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 15px;
    z-index: 200;
}

.control {
    width: 65px;
    height: 55px;
    border-radius: 15px;
    background: rgba(0,0,0,.75);
    color: white;
    font-size: 25px;
}

/* EKRANLAR */

.overlay {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.9);
    z-index: 2000;
}

.box {
    width: 90%;
    max-width: 420px;
    padding: 30px;
    background: #202020;
    border-radius: 20px;
    text-align: center;
}

.box h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

.box p {
    font-size: 20px;
    margin: 15px 0;
}

.action {
    padding: 13px 20px;
    margin: 5px;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.score {
    font-size: 35px;
    color: #facc15;
    margin: 15px;
}

.prison {
    font-size: 65px;
}
</style>
</head>

<body>

<!-- MENÜ -->

<div id="menu">

    <div class="menuBox">

        <h1>🚗 TRAFİKTEN KAÇ</h1>

        <p>MAK tarafından geliştirildi</p>

        <button class="difficulty easy" onclick="startGame('easy')">
            🟢 KOLAY
        </button>

        <button class="difficulty medium" onclick="startGame('medium')">
            🟡 ORTA
        </button>

        <button class="difficulty hard" onclick="startGame('hard')">
            🔴 ZOR
        </button>

    </div>

</div>

<!-- OYUN -->

<div id="game">

    <div id="sea"></div>

    <div id="forest">

        <div class="tree" style="top:5px;left:10px;"></div>
        <div class="tree" style="top:130px;left:35px;"></div>
        <div class="tree" style="top:260px;left:5px;"></div>
        <div class="tree" style="top:400px;left:35px;"></div>
        <div class="tree" style="top:550px;left:10px;"></div>
        <div class="tree" style="top:700px;left:35px;"></div>

    </div>

    <div id="road">

        <div id="line1" class="line"></div>
        <div id="line2" class="line"></div>

    </div>

    <div id="hud">

        <div class="hud">
            ❤️ <span id="lives">5</span>
        </div>

        <div class="hud">
            🏆 <span id="score">0</span>
        </div>

    </div>

    <!-- OYUNCU ARABASI -->

    <div id="player" class="car blue">

        <div class="carBody"></div>
        <div class="window"></div>
        <div class="rearWindow"></div>

        <div class="light left"></div>
        <div class="light right"></div>

        <div class="tail left"></div>
        <div class="tail right"></div>

    </div>

    <div id="controls">

        <button class="control" onclick="moveLeft()">⬅️</button>
        <button class="control" onclick="moveRight()">➡️</button>

    </div>

</div>

<!-- POLİS UYARISI -->

<div id="warning" class="overlay">

    <div class="box">

        <h2>🚓 DİKKAT!</h2>

        <p>Polisle ilk kez çarpıştın!</p>

        <button class="action" onclick="continueGame()">
            DEVAM ET
        </button>

    </div>

</div>

<!-- KAZANMA -->

<div id="win" class="overlay">

    <div class="box">

        <h2>🏆 TEBRİKLER!</h2>

        <p>MAK seni tebrik ediyor! 🏆</p>

        <div class="score">
            <span id="winScore">0</span>
        </div>

        <button class="action" onclick="restartGame()">
            🔄 TEKRAR OYNA
        </button>

        <button class="action" onclick="backToMenu()">
            🏠 MENÜ
        </button>

    </div>

</div>

<!-- NORMAL OYUN BİTTİ -->

<div id="gameOver" class="overlay">

    <div class="box">

        <h2>💥 OYUN BİTTİ</h2>

        <p id="normalGameOverMessage">
            Ehliyeti kasaptan mı aldın? 😂
        </p>

        <div class="score">
            Skor: <span id="finalScore">0</span>
        </div>

        <button class="action" onclick="restartGame()">
            🔄 TEKRAR OYNA
        </button>

        <button class="action" onclick="backToMenu()">
            🏠 MENÜ
        </button>

    </div>

</div>

<!-- POLİS OYUN BİTTİ -->

<div id="policeOver" class="overlay">

    <div class="box">

        <h2>🚓 YAKALANDIN!</h2>

        <div class="prison">
            🔗⛓️🔗
        </div>

        <h2 style="color:red;">
            MÜEBBET
        </h2>

        <div class="score">
            Skor: <span id="policeScore">0</span>
        </div>

        <button class="action" onclick="restartGame()">
            🔄 TEKRAR OYNA
        </button>

        <button class="action" onclick="backToMenu()">
            🏠 MENÜ
        </button>

    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const livesText = document.getElementById("lives");
const scoreText = document.getElementById("score");

const menu = document.getElementById("menu");
const warning = document.getElementById("warning");
const win = document.getElementById("win");
const gameOver = document.getElementById("gameOver");
const policeOver = document.getElementById("policeOver");

const lanes = [98, 189, 280];

let currentLane = 1;

let lives = 5;
let score = 0;

let difficulty = "easy";

let playing = false;
let paused = false;

let policeHits = 0;

/*
    NORMAL ELENME SAYISI

    1. oyun:
    Ehliyeti kasaptan mı aldın?

    2. oyun:
    Acemi misin?

    3. oyun:
    Ehliyeti kasaptan mı aldın?

    4. oyun:
    Acemi misin?
*/

let normalGameOverCount = 0;

let traffic = [];
let policeCars = [];

let trafficTimer;
let policeTimer;
let scoreTimer;
let animation;

const settings = {

    easy: {
        speed: 3,
        spawn: 1100,
        police: 9000
    },

    medium: {
        speed: 4,
        spawn: 800,
        police: 6500
    },

    hard: {
        speed: 5,
        spawn: 600,
        police: 4500
    }

};

const targets = {

    easy: 100,
    medium: 500,
    hard: 1000

};

/* OYUNU BAŞLAT */

function startGame(level) {

    difficulty = level;

    menu.style.display = "none";

    gameOver.style.display = "none";
    policeOver.style.display = "none";
    warning.style.display = "none";
    win.style.display = "none";

    lives = 5;
    score = 0;
    policeHits = 0;

    currentLane = 1;

    playing = true;
    paused = false;

    livesText.textContent = lives;
    scoreText.textContent = score;

    player.style.left = lanes[currentLane] + "px";

    clearEverything();

    startTraffic();
    startPolice();
    startScore();

    gameLoop();
}

/* SOL */

function moveLeft() {

    if (!playing || paused) return;

    if (currentLane > 0) {

        currentLane--;

        player.style.left =
            lanes[currentLane] + "px";
    }
}

/* SAĞ */

function moveRight() {

    if (!playing || paused) return;

    if (currentLane < 2) {

        currentLane++;

        player.style.left =
            lanes[currentLane] + "px";
    }
}

/* KLAVYE */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft") {
        moveLeft();
    }

    if (event.key === "ArrowRight") {
        moveRight();
    }

});

/* ARABA OLUŞTUR */

function createCar(type, lane, y) {

    const car = document.createElement("div");

    car.className = "car " + type;

    car.style.left =
        lanes[lane] + "px";

    car.style.top = y + "px";

    const body =
        document.createElement("div");

    body.className = "carBody";

    car.appendChild(body);

    const window =
        document.createElement("div");

    window.className = "window";

    car.appendChild(window);

    const rear =
        document.createElement("div");

    rear.className = "rearWindow";

    car.appendChild(rear);

    const light1 =
        document.createElement("div");

    light1.className = "light left";

    car.appendChild(light1);

    const light2 =
        document.createElement("div");

    light2.className = "light right";

    car.appendChild(light2);

    const tail1 =
        document.createElement("div");

    tail1.className = "tail left";

    car.appendChild(tail1);

    const tail2 =
        document.createElement("div");

    tail2.className = "tail right";

    car.appendChild(tail2);

    if (type === "police") {

        const policeLight =
            document.createElement("div");

        policeLight.className =
            "policeLight";

        car.appendChild(policeLight);
    }

    game.appendChild(car);

    return car;
}

/* TRAFİK */

function startTraffic() {

    function spawnTraffic() {

        if (!playing) return;

        if (!paused) {

            const lane =
                Math.floor(Math.random() * 3);

            const types = [
                "red",
                "blue",
                "gray",
                "black",
                "white",
                "green"
            ];

            const randomColor =
                types[
                    Math.floor(
                        Math.random() * types.length
                    )
                ];

            const vehicleTypes = [
                "normal",
                "suv",
                "bus",
                "truck"
            ];

            const vehicle =
                vehicleTypes[
                    Math.floor(
                        Math.random() *
                        vehicleTypes.length
                    )
                ];

            let className = randomColor;

            if (vehicle !== "normal") {
                className += " " + vehicle;
            }

            const car =
                createCar(
                    className,
                    lane,
                    -130
                );

            traffic.push({
                element: car,
                lane: lane,
                y: -130
            });
        }

        trafficTimer =
            setTimeout(
                spawnTraffic,
                settings[difficulty].spawn
            );
    }

    spawnTraffic();
}

/* POLİS */

function startPolice() {

    function spawnPolice() {

        if (!playing) return;

        if (!paused) {

            const lane =
                Math.floor(Math.random() * 3);

            const car =
                createCar(
                    "police",
                    lane,
                    game.clientHeight + 100
                );

            policeCars.push({
                element: car,
                lane: lane,
                y: game.clientHeight + 100
            });
        }

        policeTimer =
            setTimeout(
                spawnPolice,
                settings[difficulty].police
            );
    }

    policeTimer =
        setTimeout(
            spawnPolice,
            settings[difficulty].police
        );
}

/* SKOR */

function startScore() {

    function addScore() {

        if (!playing) return;

        if (!paused) {

            const points =
                Math.floor(
                    Math.random() * 4
                ) + 3;

            score += points;

            scoreText.textContent = score;

            if (
                score >=
                targets[difficulty]
            ) {

                paused = true;

                document.getElementById(
                    "winScore"
                ).textContent = score;

                win.style.display = "flex";

                return;
            }
        }

        scoreTimer =
            setTimeout(
                addScore,
                Math.floor(
                    Math.random() * 2000
                ) + 1000
            );
    }

    scoreTimer =
        setTimeout(
            addScore,
            1000
        );
}

/* OYUN DÖNGÜSÜ */

function gameLoop() {

    if (!playing) return;

    if (!paused) {

        moveTraffic();
        movePolice();
        moveLines();
        checkCollisions();
    }

    animation =
        requestAnimationFrame(gameLoop);
}

/* TRAFİK HAREKETİ */

function moveTraffic() {

    for (
        let i = traffic.length - 1;
        i >= 0;
        i--
    ) {

        const car = traffic[i];

        car.y +=
            settings[difficulty].speed;

        car.element.style.top =
            car.y + "px";

        if (
            car.y >
            game.clientHeight + 150
        ) {

            car.element.remove();

            traffic.splice(i, 1);
        }
    }
}

/* POLİS HAREKETİ */

function movePolice() {

    for (
        let i = policeCars.length - 1;
        i >= 0;
        i--
    ) {

        const car = policeCars[i];

        car.y -=
            settings[difficulty].speed;

        car.element.style.top =
            car.y + "px";

        if (car.y < -150) {

            car.element.remove();

            policeCars.splice(i, 1);
        }
    }
}

/* YOL ÇİZGİLERİ */

let linePosition = 0;

function moveLines() {

    linePosition +=
        settings[difficulty].speed;

    if (linePosition > 80) {
        linePosition = 0;
    }

    document.getElementById("line1")
        .style.top =
        linePosition + "px";

    document.getElementById("line2")
        .style.top =
        linePosition + "px";
}

/* ÇARPIŞMA */

function isCollision(a, b) {

    const A =
        a.getBoundingClientRect();

    const B =
        b.getBoundingClientRect();

    return (
        A.left < B.right &&
        A.right > B.left &&
        A.top < B.bottom &&
        A.bottom > B.top
    );
}

/* ÇARPIŞMALARI KONTROL ET */

function checkCollisions() {

    /* NORMAL TRAFİK */

    for (
        let i = traffic.length - 1;
        i >= 0;
        i--
    ) {

        const car = traffic[i];

        if (
            car.lane === currentLane &&
            isCollision(
                player,
                car.element
            )
        ) {

            car.element.remove();

            traffic.splice(i, 1);

            lives--;

            livesText.textContent =
                lives;

            if (lives <= 0) {

                endGame();

                return;
            }
        }
    }

    /* POLİS */

    for (
        let i = policeCars.length - 1;
        i >= 0;
        i--
    ) {

        const car = policeCars[i];

        if (
            car.lane === currentLane &&
            isCollision(
                player,
                car.element
            )
        ) {

            car.element.remove();

            policeCars.splice(i, 1);

            policeHits++;

            if (policeHits === 1) {

                paused = true;

                warning.style.display =
                    "flex";

            } else {

                endPoliceGame();

                return;
            }
        }
    }
}

/* NORMAL OYUN BİTTİ */

function endGame() {

    playing = false;
    paused = true;

    clearTimers();

    normalGameOverCount++;

    if (
        normalGameOverCount % 2 === 1
    ) {

        document.getElementById(
            "normalGameOverMessage"
        ).textContent =
            "Ehliyeti kasaptan mı aldın? 😂";

    } else {

        document.getElementById(
            "normalGameOverMessage"
        ).textContent =
            "Acemi misin? 😂";
    }

    document.getElementById(
        "finalScore"
    ).textContent = score;

    gameOver.style.display =
        "flex";
}

/* POLİS GAME OVER */

function endPoliceGame() {

    playing = false;
    paused = true;

    clearTimers();

    document.getElementById(
        "policeScore"
    ).textContent = score;

    policeOver.style.display =
        "flex";
}

/* POLİS UYARISINDAN DEVAM */

function continueGame() {

    warning.style.display =
        "none";

    paused = false;
}

/* TEKRAR OYNA */

function restartGame() {

    /*
        Burada normalGameOverCount
        sıfırlanmıyor.
    */

    startGame(difficulty);
}

/* MENÜ */

function backToMenu() {

    playing = false;
    paused = false;

    normalGameOverCount = 0;

    clearTimers();

    removeCars();

    gameOver.style.display = "none";
    policeOver.style.display = "none";
    warning.style.display = "none";
    win.style.display = "none";

    menu.style.display = "flex";
}

/* HER ŞEYİ TEMİZLE */

function clearTimers() {

    clearTimeout(trafficTimer);
    clearTimeout(policeTimer);
    clearTimeout(scoreTimer);

    cancelAnimationFrame(animation);
}

/* ARABALARI SİL */

function removeCars() {

    for (let i = 0; i < traffic.length; i++) {

        traffic[i].element.remove();
    }

    for (let i = 0; i < policeCars.length; i++) {

        policeCars[i].element.remove();
    }

    traffic = [];
    policeCars = [];
}

</script>

</body>
</html>
