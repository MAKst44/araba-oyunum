<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trafikten Kaç - MAK</title>

<style> 
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    overflow: hidden;
}

/* MENÜ */
#menu {
    position: fixed;
    inset: 0;
    background: linear-gradient(#111827, #020617);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

#menu h1 {
    font-size: 46px;
    margin-bottom: 10px;
    color: #00e5ff;
    text-shadow: 0 0 15px #00e5ff;
}

#menu h2 {
    margin-bottom: 35px;
    color: #aaa;
}

.menuButton {
    width: 230px;
    padding: 15px;
    margin: 8px;
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #2563eb;
    color: white;
}

.menuButton:hover {
    transform: scale(1.05);
    background: #3b82f6;
}

/* OYUN */
#game {
    position: fixed;
    inset: 0;
    display: none;
    background: #5ec8ff;
}

/* DENİZ */
#sea {
    position: absolute;
    left: 0;
    top: 0;
    width: calc((100% - 280px) / 2);
    height: 100%;
    background:
        repeating-linear-gradient(
            0deg,
            #168bd0 0px,
            #168bd0 12px,
            #32a9e8 13px,
            #32a9e8 20px
        );
}

/* ORMAN */
#forest {
    position: absolute;
    right: 0;
    top: 0;
    width: calc((100% - 280px) / 2);
    height: 100%;
    background: #176b2c;
    overflow: hidden;
}

.tree {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #064e1b;
    border-radius: 50%;
    box-shadow: 10px 5px #0a7a28, -10px 7px #0a7a28;
}

/* YOL */
#road {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 0;
    width: 280px;
    height: 100%;
    background: #383838;
    overflow: hidden;
    border-left: 5px solid #eee;
    border-right: 5px solid #eee;
}

.laneLine {
    position: absolute;
    width: 7px;
    height: 80px;
    background: white;
    left: 91px;
    top: -100px;
    border-radius: 5px;
}

#line2 {
    left: 182px;
}

/* HUD */
#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100;
    background: rgba(0,0,0,.7);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 18px;
    line-height: 1.7;
}

#hud span {
    color: #00e5ff;
    font-weight: bold;
}

/* OYUNCU */
.car {
    position: absolute;
    width: 58px;
    height: 105px;
    z-index: 50;
}

.player {
    bottom: 100px;
    left: 111px;
    transition: left .12s;
}

/* ARABA GÖVDESİ */
.carBody {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px 15px 10px 10px;
    box-shadow: inset 0 0 8px rgba(255,255,255,.4);
}

/* CAM */
.window {
    position: absolute;
    width: 34px;
    height: 28px;
    left: 12px;
    top: 15px;
    background: #172033;
    border-radius: 8px;
    border: 2px solid #8bd9ff;
}

.rearWindow {
    position: absolute;
    width: 34px;
    height: 24px;
    left: 12px;
    bottom: 15px;
    background: #172033;
    border-radius: 7px;
}

/* IŞIK */
.light {
    position: absolute;
    width: 10px;
    height: 7px;
    background: #fff;
    border-radius: 4px;
    top: 5px;
}

.light.left {
    left: 8px;
}

.light.right {
    right: 8px;
}

.tail {
    position: absolute;
    width: 10px;
    height: 7px;
    background: #ff1717;
    border-radius: 3px;
    bottom: 5px;
}

.tail.left {
    left: 8px;
}

.tail.right {
    right: 8px;
}

/* ARABA RENKLERİ */
.red .carBody {
    background: #d91e18;
}

.blue .carBody {
    background: #1769aa;
}

.white .carBody {
    background: #eee;
}

.black .carBody {
    background: #111;
}

.gray .carBody {
    background: #777;
}

.green .carBody {
    background: #15803d;
}

/* SUV */
.suv {
    width: 66px;
    height: 115px;
}

.suv .carBody {
    border-radius: 12px;
}

/* OTOBÜS */
.bus {
    width: 70px;
    height: 145px;
}

.bus .carBody {
    border-radius: 8px;
    background: #f59e0b;
}

.bus .window {
    width: 46px;
    height: 65px;
    left: 12px;
    top: 15px;
    background: #172033;
}

.bus .rearWindow {
    display: none;
}

/* KAMYON */
.truck {
    width: 72px;
    height: 130px;
}

.truck .carBody {
    background: #64748b;
    border-radius: 7px;
}

.truck .window {
    background: #26364d;
}

/* POLİS */
.police {
    width: 62px;
    height: 110px;
}

.police .carBody {
    background: #f3f4f6;
    border: 3px solid #111;
}

.police .window {
    background: #111827;
}

.policeLight {
    position: absolute;
    top: -8px;
    left: 13px;
    width: 36px;
    height: 9px;
    border-radius: 5px;
    background: linear-gradient(
        to right,
        #ef4444 50%,
        #2563eb 50%
    );
    box-shadow: 0 0 12px #ff0000;
}

/* POLİS UYARISI */
#policeAlert {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 150;
    display: none;
    width: 360px;
    max-width: 80%;
    text-align: center;
    padding: 13px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
    background: rgba(180,0,0,.9);
    border: 3px solid red;
    box-shadow: 0 0 25px red;
    animation: policeFlash .45s infinite alternate;
}

@keyframes policeFlash {
    from {
        opacity: .45;
        transform: translateX(-50%) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) scale(1.02);
    }
}

/* KONTROLLER */
#controls {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    gap: 20px;
}

.controlButton {
    width: 75px;
    height: 55px;
    border: none;
    border-radius: 12px;
    background: rgba(0,0,0,.75);
    color: white;
    font-size: 28px;
    cursor: pointer;
}

/* EKRANLAR */
.overlay {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,.82);
    text-align: center;
}

.overlay h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

.overlay p {
    font-size: 23px;
    margin: 8px;
}

.overlay button {
    margin-top: 20px;
    padding: 13px 28px;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* POLİS UYARI */
#warning h1 {
    color: #ff3030;
}

/* KAZANDIN */
#win h1 {
    color: #ffd700;
}

/* OYUN BİTTİ */
#gameOver h1 {
    color: #ff4d4d;
}

/* MÜEBBET */
#policeOver h1 {
    color: #ff2020;
    font-size: 55px;
}

.handcuffs {
    font-size: 55px;
    margin: 15px;
}
</style>
</head>

<body>

<!-- MENÜ -->
<div id="menu">
    <h1>🚗 TRAFİKTEN KAÇ</h1>
    <h2>MAK</h2>

    <button class="menuButton" onclick="startGame('easy')">
        🟢 KOLAY
    </button>

    <button class="menuButton" onclick="startGame('medium')">
        🟡 ORTA
    </button>

    <button class="menuButton" onclick="startGame('hard')">
        🔴 ZOR
    </button>
</div>

<!-- OYUN -->
<div id="game">

    <div id="sea"></div>
    <div id="forest"></div>

    <div id="road">

        <div id="line1" class="laneLine"></div>
        <div id="line2" class="laneLine"></div>

        <!-- OYUNCU -->
        <div id="player" class="car player blue">
            <div class="carBody">
                <div class="light left"></div>
                <div class="light right"></div>

                <div class="window"></div>
                <div class="rearWindow"></div>

                <div class="tail left"></div>
                <div class="tail right"></div>
            </div>
        </div>

    </div>

    <!-- HUD -->
    <div id="hud">
        ❤️ Can: <span id="lives">5</span><br>
        ⭐ Skor: <span id="score">0</span><br>
        🎯 Hedef: <span id="target">100</span>
    </div>

    <!-- POLİS UYARISI -->
    <div id="policeAlert">
        🚨 POLİS YAKLAŞIYOR 🚨
    </div>

    <!-- KONTROLLER -->
    <div id="controls">
        <button class="controlButton" onclick="moveLeft()">⬅️</button>
        <button class="controlButton" onclick="moveRight()">➡️</button>
    </div>

    <!-- İLK POLİS ÇARPMASI -->
    <div id="warning" class="overlay">
        <h1>🚓 DİKKAT!</h1>
        <p>Polise yakalandın!</p>
        <p>Bir şansın daha var.</p>
        <button onclick="continueAfterWarning()">DEVAM ET</button>
    </div>

    <!-- KAZANMA -->
    <div id="win" class="overlay">
        <h1>🏆 MAK seni tebrik ediyor! 🏆</h1>
        <p id="winScore"></p>
        <button onclick="restartGame()">TEKRAR OYNA</button>
        <button onclick="backToMenu()">MENÜ</button>
    </div>

    <!-- NORMAL OYUN BİTTİ -->
    <div id="gameOver" class="overlay">
        <h1 id="gameOverText"></h1>
        <p id="finalScore"></p>
        <button onclick="restartGame()">TEKRAR OYNA</button>
        <button onclick="backToMenu()">MENÜ</button>
    </div>

    <!-- POLİS OYUN BİTTİ -->
    <div id="policeOver" class="overlay">
        <h1>MÜEBBET</h1>
        <div class="handcuffs">🔗⛓️🔗</div>
        <p>Polis seni yakaladı!</p>
        <p id="policeFinalScore"></p>
        <button onclick="restartGame()">TEKRAR OYNA</button>
        <button onclick="backToMenu()">MENÜ</button>
    </div>

</div>

<script>

/* -----------------------------
   OYUN AYARLARI
----------------------------- */

const settings = {
    easy: {
        speed: 3,
        spawn: 1400,
        police: 9000,
        target: 100
    },

    medium: {
        speed: 4,
        spawn: 1050,
        police: 6500,
        target: 500
    },

    hard: {
        speed: 5,
        spawn: 850,
        police: 4500,
        target: 1000
    }
};

/* -----------------------------
   DEĞİŞKENLER
----------------------------- */

let difficulty = "easy";

let currentLane = 1;

let lives = 5;

let score = 0;

let targetScore = 100;

let playing = false;

let paused = false;

let policeHits = 0;

let normalGameOverCount = 0;

let traffic = [];

let policeCars = [];

let trafficTimer = null;

let policeTimer = null;

let scoreTimer = null;

let animationFrame = null;

let linePosition = 0;

/* ŞERİT KONUMU */
const lanePositions = [36, 111, 186];

/* -----------------------------
   HTML ELEMANLARI
----------------------------- */

const menu = document.getElementById("menu");

const game = document.getElementById("game");

const player = document.getElementById("player");

const livesText = document.getElementById("lives");

const scoreText = document.getElementById("score");

const targetText = document.getElementById("target");

const policeAlert = document.getElementById("policeAlert");

const warning = document.getElementById("warning");

const win = document.getElementById("win");

const gameOver = document.getElementById("gameOver");

const policeOver = document.getElementById("policeOver");

const finalScore = document.getElementById("finalScore");

const policeFinalScore = document.getElementById("policeFinalScore");

const winScore = document.getElementById("winScore");

const gameOverText = document.getElementById("gameOverText");

/* -----------------------------
   MENÜDEN OYUNA BAŞLA
----------------------------- */

function startGame(level) {

    difficulty = level;

    lives = 5;
    score = 0;
    policeHits = 0;

    currentLane = 1;

    targetScore = settings[level].target;

    playing = true;
    paused = false;

    traffic = [];
    policeCars = [];

    menu.style.display = "none";

    game.style.display = "block";

    warning.style.display = "none";
    win.style.display = "none";
    gameOver.style.display = "none";
    policeOver.style.display = "none";

    policeAlert.style.display = "none";

    livesText.textContent = lives;
    scoreText.textContent = score;
    targetText.textContent = targetScore;

    player.style.left = lanePositions[currentLane] + "px";

    clearTimers();

    startTraffic();

    startPolice();

    startScore();

    gameLoop();
}

/* -----------------------------
   ZAMANLAYICILARI TEMİZLE
----------------------------- */

function clearTimers() {

    if (trafficTimer) {
        clearInterval(trafficTimer);
        trafficTimer = null;
    }

    if (policeTimer) {
        clearInterval(policeTimer);
        policeTimer = null;
    }

    if (scoreTimer) {
        clearInterval(scoreTimer);
        scoreTimer = null;
    }
}

/* -----------------------------
   TRAFİK OLUŞTUR
----------------------------- */

function startTraffic() {

    trafficTimer = setInterval(() => {

        if (!playing || paused) return;

        const lanes = [0, 1, 2];

        lanes.sort(() => Math.random() - 0.5);

        for (let i = 0; i < lanes.length; i++) {

            const lane = lanes[i];

            const blocked = traffic.some(car =>
                car.lane === lane && car.y < 260
            );

            if (!blocked) {

                let type;

                const random = Math.random();

                if (random < 0.60) {
                    type = "normal";
                }
                else if (random < 0.78) {
                    type = "suv";
                }
                else if (random < 0.90) {
                    type = "bus";
                }
                else {
                    type = "truck";
                }

                createTraffic(type, lane);

                break;
            }
        }

    }, settings[difficulty].spawn);
}

/* -----------------------------
   TRAFİK ARABASI OLUŞTUR
----------------------------- */

function createTraffic(type, lane) {

    const car = document.createElement("div");

    const colors = [
        "red",
        "blue",
        "white",
        "black",
        "gray",
        "green"
    ];

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    car.className = "car " + color + " " + type;

    car.innerHTML = `
        <div class="carBody">
            <div class="light left"></div>
            <div class="light right"></div>
            <div class="window"></div>
            <div class="rearWindow"></div>
            <div class="tail left"></div>
            <div class="tail right"></div>
        </div>
    `;

    car.style.left = lanePositions[lane] + "px";

    car.style.top = "-160px";

    document.getElementById("road").appendChild(car);

    traffic.push({
        element: car,
        lane: lane,
        y: -160,
        speed: settings[difficulty].speed +
               Math.random() * 1.5
    });
}

/* -----------------------------
   POLİS OLUŞTUR
----------------------------- */

function startPolice() {

    policeTimer = setInterval(() => {

        if (!playing || paused) return;

        createPolice();

    }, settings[difficulty].police);
}

/* -----------------------------
   POLİS ARABASI
----------------------------- */

function createPolice() {

    const lane =
        Math.floor(Math.random() * 3);

    const car = document.createElement("div");

    car.className = "car police";

    car.innerHTML = `
        <div class="carBody">
            <div class="policeLight"></div>
            <div class="light left"></div>
            <div class="light right"></div>
            <div class="window"></div>
            <div class="rearWindow"></div>
            <div class="tail left"></div>
            <div class="tail right"></div>
        </div>
    `;

    car.style.left = lanePositions[lane] + "px";

    car.style.top = "110%";

    document.getElementById("road").appendChild(car);

    policeCars.push({
        element: car,
        lane: lane,
        y: window.innerHeight,
        speed: settings[difficulty].speed + 1.5
    });

    policeAlert.style.display = "block";
}

/* -----------------------------
   SKOR
----------------------------- */

function startScore() {

    scoreTimer = setInterval(() => {

        if (!playing || paused) return;

        const points =
            Math.floor(Math.random() * 4) + 3;

        score += points;

        scoreText.textContent = score;

        if (score >= targetScore) {
            winGame();
        }

    }, 2000);
}

/* -----------------------------
   OYUNCU HAREKETİ
----------------------------- */

function moveLeft() {

    if (!playing || paused) return;

    if (currentLane > 0) {

        currentLane--;

        player.style.left =
            lanePositions[currentLane] + "px";
    }
}

function moveRight() {

    if (!playing || paused) return;

    if (currentLane < 2) {

        currentLane++;

        player.style.left =
            lanePositions[currentLane] + "px";
    }
}

/* -----------------------------
   KLAVYE
----------------------------- */

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        moveLeft();
    }

    if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        moveRight();
    }

});

/* -----------------------------
   ANA OYUN DÖNGÜSÜ
----------------------------- */

function gameLoop() {

    if (!playing) return;

    if (!paused) {

        moveTraffic();

        movePolice();

        moveRoadLines();

        checkCollisions();
    }

    animationFrame =
        requestAnimationFrame(gameLoop);
}

/* -----------------------------
   TRAFİK HAREKETİ
----------------------------- */

function moveTraffic() {

    for (let i = traffic.length - 1; i >= 0; i--) {

        const car = traffic[i];

        car.y += car.speed;

        car.element.style.top =
            car.y + "px";

        if (car.y > window.innerHeight + 180) {

            car.element.remove();

            traffic.splice(i, 1);
        }
    }
}

/* -----------------------------
   POLİS HAREKETİ
----------------------------- */

function movePolice() {

    for (let i = policeCars.length - 1; i >= 0; i--) {

        const police = policeCars[i];

        police.y -= police.speed;

        police.element.style.top =
            police.y + "px";

        if (police.y < -150) {

            police.element.remove();

            policeCars.splice(i, 1);
        }
    }

    if (policeCars.length === 0) {
        policeAlert.style.display = "none";
    }
}

/* -----------------------------
   YOL ÇİZGİLERİ
----------------------------- */

function moveRoadLines() {

    linePosition += settings[difficulty].speed;

    if (linePosition >= 100) {
        linePosition = 0;
    }

    document.getElementById("line1").style.top =
        (linePosition - 100) + "px";

    document.getElementById("line2").style.top =
        (linePosition - 100) + "px";
}

/* -----------------------------
   ÇARPIŞMA KONTROLÜ
----------------------------- */

function checkCollisions() {

    const playerRect =
        player.getBoundingClientRect();

    /* NORMAL TRAFİK */
    for (let i = traffic.length - 1; i >= 0; i--) {

        const car = traffic[i];

        const rect =
            car.element.getBoundingClientRect();

        if (isColliding(playerRect, rect)) {

            car.element.remove();

            traffic.splice(i, 1);

            lives--;

            livesText.textContent = lives;

            if (lives <= 0) {

                endGame();

                return;
            }
        }
    }

    /* POLİS */
    for (let i = policeCars.length - 1; i >= 0; i--) {

        const police = policeCars[i];

        const rect =
            police.element.getBoundingClientRect();

        if (isColliding(playerRect, rect)) {

            police.element.remove();

            policeCars.splice(i, 1);

            policeHit();

            return;
        }
    }
}

/* -----------------------------
   ÇARPIŞMA FONKSİYONU
----------------------------- */

function isColliding(a, b) {

    return (
        a.left < b.right - 8 &&
        a.right > b.left + 8 &&
        a.top < b.bottom - 8 &&
        a.bottom > b.top + 8
    );
}

/* -----------------------------
   POLİS ÇARPMASI
----------------------------- */

function policeHit() {

    policeHits++;

    policeAlert.style.display = "none";

    if (policeHits === 1) {

        paused = true;

        warning.style.display = "flex";

    }
    else {

        endPoliceGame();
    }
}

/* -----------------------------
   POLİS UYARISINDAN DEVAM
----------------------------- */

function continueAfterWarning() {

    warning.style.display = "none";

    paused = false;
}

/* -----------------------------
   NORMAL OYUN BİTTİ
----------------------------- */

function endGame() {

    if (!playing) return;

    playing = false;
    paused = true;

    clearTimers();

    policeAlert.style.display = "none";

    normalGameOverCount++;

    if (normalGameOverCount % 2 === 1) {

        gameOverText.textContent =
            "Ehliyeti kasaptan mı aldın? 😂";

    }
    else {

        gameOverText.textContent =
            "Acemi misin? 😂";
    }

    finalScore.textContent =
        "Skorun: " + score;

    gameOver.style.display = "flex";
}

/* -----------------------------
   POLİS OYUN BİTTİ
----------------------------- */

function endPoliceGame() {

    playing = false;
    paused = true;

    clearTimers();

    policeAlert.style.display = "none";

    policeFinalScore.textContent =
        "Skorun: " + score;

    policeOver.style.display = "flex";
}

/* -----------------------------
   KAZANDIN
----------------------------- */

function winGame() {

    if (!playing) return;

    playing = false;
    paused = true;

    clearTimers();

    policeAlert.style.display = "none";

    winScore.textContent =
        "Skorun: " + score;

    win.style.display = "flex";
}

/* -----------------------------
   TEKRAR OYNA
----------------------------- */

function restartGame() {

    clearTimers();

    removeAllCars();

    startGame(difficulty);
}

/* -----------------------------
   MENÜYE DÖN
----------------------------- */

function backToMenu() {

    playing = false;
    paused = false;

    clearTimers();

    removeAllCars();

    warning.style.display = "none";
    win.style.display = "none";
    gameOver.style.display = "none";
    policeOver.style.display = "none";

    policeAlert.style.display = "none";

    game.style.display = "none";

    menu.style.display = "flex";

    /* OYUN BİTTİ MESAJ SIRASI MENÜDE SIFIRLANIR */
    normalGameOverCount = 0;
}

/* -----------------------------
   TÜM ARABALARI SİL
----------------------------- */

function removeAllCars() {

    traffic.forEach(car => {
        car.element.remove();
    });

    policeCars.forEach(car => {
        car.element.remove();
    });

    traffic = [];
    policeCars = [];
}

/* -----------------------------
   AĞAÇLAR
----------------------------- */

function createTrees() {

    const forest =
        document.getElementById("forest");

    for (let i = 0; i < 35; i++) {

        const tree =
            document.createElement("div");

        tree.className = "tree";

        tree.style.left =
            Math.random() * 90 + "%";

        tree.style.top =
            Math.random() * 100 + "%";

        forest.appendChild(tree);
    }
}

createTrees();

</script>
