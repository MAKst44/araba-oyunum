<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trafikten Kaç - MAK</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

/* ANA MENÜ */
#menu {
    position: fixed;
    inset: 0;
    background: linear-gradient(#111, #222);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.menu-box {
    text-align: center;
    background: #202020;
    padding: 35px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 0 30px black;
}

.menu-box h1 {
    margin-top: 0;
    color: #ff3333;
    font-size: 38px;
}

.menu-box p {
    color: #ccc;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px 25px;
    margin: 8px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #e53935;
}

button:hover {
    transform: scale(1.05);
    background: #ff5252;
}

/* OYUN */
#game {
    width: 390px;
    height: 100vh;
    max-height: 800px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: #555;
}

/* YOL */
#road {
    position: absolute;
    left: 90px;
    top: 0;
    width: 210px;
    height: 100%;
    background: #333;
    border-left: 6px solid #ddd;
    border-right: 6px solid #ddd;
}

/* ŞERİT ÇİZGİLERİ */
.lane-line {
    position: absolute;
    top: -100px;
    height: 100px;
    width: 5px;
    background: repeating-linear-gradient(
        to bottom,
        white 0px,
        white 35px,
        transparent 35px,
        transparent 70px
    );
    opacity: 0.8;
}

.line1 {
    left: 156px;
}

.line2 {
    left: 222px;
}

/* BİLGİ PANELİ */
#info {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 2px 2px 3px black;
}

#lives {
    color: #ff4444;
}

/* ARABA TEMEL */
.car {
    position: absolute;
    width: 44px;
    height: 78px;
    border-radius: 12px 12px 8px 8px;
}

/* OYUNCU ARABASI */
.player {
    background: linear-gradient(
        to right,
        #9b0000,
        #ff2222,
        #9b0000
    );
    border: 2px solid #ff7777;
    box-shadow: 0 5px 10px black;
    z-index: 10;
}

.player::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 9px;
    width: 26px;
    height: 23px;
    background: linear-gradient(#bde7ff, #426b88);
    border-radius: 6px;
    border: 2px solid #222;
}

.player::after {
    content: "";
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 7px;
    height: 6px;
    background: white;
    border-radius: 3px;
}

/* ARKA SPOILER */
.player .spoiler {
    position: absolute;
    bottom: -4px;
    left: -5px;
    width: 54px;
    height: 7px;
    background: #111;
    border-radius: 3px;
}

/* TRAFİK ARAÇLARI */
.traffic {
    z-index: 5;
}

/* SEDAN */
.sedan {
    background: linear-gradient(
        to right,
        #333,
        #777,
        #333
    );
    border: 2px solid #aaa;
}

.sedan::before,
.suv::before,
.truck::before,
.bus::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 10px;
    width: 26px;
    height: 23px;
    background: #8ecae6;
    border-radius: 5px;
    border: 2px solid #222;
}

/* SUV */
.suv {
    height: 82px;
    background: linear-gradient(
        to right,
        #111,
        #444,
        #111
    );
    border: 2px solid #777;
}

/* OTOBÜS */
.bus {
    width: 48px;
    height: 105px;
    border-radius: 7px;
    background: linear-gradient(
        to right,
        #1e5eff,
        #66aaff,
        #1e5eff
    );
}

.bus::before {
    width: 32px;
    height: 45px;
    left: 6px;
}

/* KAMYON */
.truck {
    width: 50px;
    height: 95px;
    border-radius: 5px;
    background: linear-gradient(
        to right,
        #b96b00,
        #ffae00,
        #b96b00
    );
}

.truck::before {
    width: 32px;
    height: 22px;
    left: 7px;
}

/* POLİS */
.police {
    background: linear-gradient(
        to right,
        #111,
        #f5f5f5,
        #111
    );
    border: 2px solid #222;
    z-index: 6;
}

.police::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 10px;
    width: 26px;
    height: 22px;
    background: #78bde8;
    border: 2px solid #222;
    border-radius: 5px;
}

.police::after {
    content: "";
    position: absolute;
    top: -5px;
    left: 10px;
    width: 20px;
    height: 7px;
    background: linear-gradient(
        to right,
        red 50%,
        blue 50%
    );
    border-radius: 3px;
}

/* EKRANLAR */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 50;
    display: none;
    justify-content: center;
    align-items: center;
}

.box {
    background: #202020;
    padding: 30px;
    width: 330px;
    text-align: center;
    border-radius: 20px;
    box-shadow: 0 0 30px black;
}

.box h2 {
    color: #ff3333;
    font-size: 30px;
}

.celebrate h2 {
    color: gold;
}

/* MOBİL KONTROLLER */
#controls {
    position: fixed;
    bottom: 15px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 30px;
    z-index: 80;
}

.control {
    width: 70px;
    height: 55px;
    border-radius: 15px;
    background: rgba(255,255,255,0.2);
    font-size: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>
</head>

<body>

<!-- MENÜ -->
<div id="menu">
    <div class="menu-box">
        <h1>🚗 Trafikten Kaç</h1>
        <p>MAK tarafından hazırlandı</p>
        <p>Zorluk seviyesini seç:</p>

        <button onclick="startGame('easy')">
            🟢 Kolay
        </button>

        <button onclick="startGame('medium')">
            🟡 Orta
        </button>

        <button onclick="startGame('hard')">
            🔴 Zor
        </button>
    </div>
</div>

<!-- OYUN -->
<div id="game">

    <div id="road">
        <div class="lane-line line1"></div>
        <div class="lane-line line2"></div>
    </div>

    <div id="info">
        <div>❤️ <span id="lives">3</span></div>
        <div>🏆 <span id="score">0</span></div>
        <div>🎯 <span id="target">100</span></div>
    </div>

    <!-- OYUNCU -->
    <div id="player" class="car player">
        <div class="spoiler"></div>
    </div>

    <!-- KUTLAMA -->
    <div id="celebration" class="overlay">
        <div class="box celebrate">
            <h2>🏆 MAK seni tebrik ediyor! 🏆</h2>
            <p>Hedefe ulaştın!</p>
            <p>Skor: <b id="celebrateScore">0</b></p>
            <button onclick="continueGame()">Devam Et</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver" class="overlay">
        <div class="box">
            <h2>💥 Oyun Bitti</h2>
            <p>Skorun:</p>
            <h1 id="finalScore">0</h1>

            <button onclick="restartGame()">
                🔄 Tekrar Oyna
            </button>

            <button onclick="backToMenu()">
                🏠 Menü
            </button>
        </div>
    </div>

</div>

<!-- KONTROLLER -->
<div id="controls">
    <div class="control" onclick="moveLeft()">⬅️</div>
    <div class="control" onclick="moveRight()">➡️</div>
</div>

<script>

/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");
const targetText = document.getElementById("target");

const celebration = document.getElementById("celebration");
const gameOverScreen = document.getElementById("gameOver");

const celebrateScore =
    document.getElementById("celebrateScore");

const finalScore =
    document.getElementById("finalScore");

let playing = false;
let paused = false;

let score = 0;
let lives = 3;

let difficulty = "easy";

let playerLane = 1;

let traffic = [];
let police = [];

let gameSpeed = 3;
let spawnTimer = 0;
let policeTimer = 0;

let scoreTimer = null;

let celebrationShown = false;

let animationId;


/* =========================
   AYARLAR
========================= */

const targetScores = {
    easy: 100,
    medium: 500,
    hard: 1000
};

const difficultySettings = {

    easy: {
        speed: 3,
        trafficDelay: 80,
        policeDelay: 700
    },

    medium: {
        speed: 4,
        trafficDelay: 65,
        policeDelay: 550
    },

    hard: {
        speed: 5,
        trafficDelay: 50,
        policeDelay: 420
    }

};


/* =========================
   ŞERİTLER
========================= */

const lanes = [125, 191, 257];


/* =========================
   OYUN BAŞLAT
========================= */

function startGame(level) {

    difficulty = level;

    score = 0;
    lives = 3;

    playerLane = 1;

    traffic = [];
    police = [];

    playing = true;
    paused = false;

    celebrationShown = false;

    scoreText.textContent = score;
    livesText.textContent = lives;

    targetText.textContent =
        targetScores[difficulty];

    gameSpeed =
        difficultySettings[difficulty].speed;

    spawnTimer = 0;
    policeTimer = 0;

    menu.style.display = "none";

    celebration.style.display = "none";
    gameOverScreen.style.display = "none";

    /* Eski araçları temizle */
    document.querySelectorAll(".traffic, .police")
        .forEach(car => car.remove());

    /* Oyuncu başlangıç */
    player.style.left =
        lanes[playerLane] + "px";

    player.style.top =
        "calc(100% - 110px)";

    /* Puan sistemini başlat */
    startScoreSystem();

    gameLoop();
}


/* =========================
   PUAN SİSTEMİ
   1-3 SANİYE
   1-4 PUAN
========================= */

function startScoreSystem() {

    if (scoreTimer) {
        clearTimeout(scoreTimer);
    }

    function addRandomScore() {

        if (!playing) {
            return;
        }

        if (!paused) {

            const earned =
                Math.floor(Math.random() * 4) + 1;

            score += earned;

            scoreText.textContent = score;

            /* Hedef kontrol */
            if (
                !celebrationShown &&
                score >= targetScores[difficulty]
            ) {

                celebrationShown = true;

                paused = true;

                celebrateScore.textContent =
                    score;

                celebration.style.display =
                    "flex";

                return;
            }
        }

        /* 1-3 saniye */
        const nextTime =
            Math.floor(Math.random() * 2000) + 1000;

        scoreTimer =
            setTimeout(addRandomScore, nextTime);
    }

    const firstTime =
        Math.floor(Math.random() * 2000) + 1000;

    scoreTimer =
        setTimeout(addRandomScore, firstTime);
}


/* =========================
   ŞERİT KONTROLÜ
========================= */

function laneHasVehicle(lane) {

    const x = lanes[lane];

    for (let car of traffic) {

        if (
            Math.abs(
                parseInt(car.style.left) - x
            ) < 5 &&
            parseInt(car.style.top) < 150
        ) {
            return true;
        }
    }

    return false;
}


/* =========================
   TRAFİK OLUŞTUR
========================= */

function createTraffic() {

    let availableLanes = [];

    for (let i = 0; i < lanes.length; i++) {

        if (!laneHasVehicle(i)) {
            availableLanes.push(i);
        }
    }

    if (availableLanes.length === 0) {
        return;
    }

    const lane =
        availableLanes[
            Math.floor(
                Math.random() *
                availableLanes.length
            )
        ];

    const types =
        ["sedan", "suv", "bus", "truck"];

    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    const car =
        document.createElement("div");

    car.className =
        "car traffic " + type;

    car.style.left =
        lanes[lane] + "px";

    car.style.top =
        "-120px";

    document.getElementById("game")
        .appendChild(car);

    traffic.push(car);
}


/* =========================
   POLİS OLUŞTUR
========================= */

function createPolice() {

    let availableLanes = [];

    for (let i = 0; i < lanes.length; i++) {

        if (!laneHasVehicle(i)) {
            availableLanes.push(i);
        }
    }

    if (availableLanes.length === 0) {
        return;
    }

    const lane =
        availableLanes[
            Math.floor(
                Math.random() *
                availableLanes.length
            )
        ];

    const car =
        document.createElement("div");

    car.className =
        "car police";

    car.style.left =
        lanes[lane] + "px";

    car.style.top =
        "-120px";

    document.getElementById("game")
        .appendChild(car);

    police.push(car);
}


/* =========================
   ÇARPIŞMA
========================= */

function collision(a, b) {

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();

    return !(
        r1.right < r2.left ||
        r1.left > r2.right ||
        r1.bottom < r2.top ||
        r1.top > r2.bottom
    );
}


/* =========================
   CAN KAYBET
========================= */

function loseLife() {

    lives--;

    livesText.textContent = lives;

    if (lives <= 0) {

        endGame();
    }
}


/* =========================
   OYUN DÖNGÜSÜ
========================= */

function gameLoop() {

    if (!playing) {
        return;
    }

    if (!paused) {

        /* Trafik üret */
        spawnTimer++;

        if (
            spawnTimer >=
            difficultySettings[difficulty].trafficDelay
        ) {

            spawnTimer = 0;

            createTraffic();
        }


        /* Polis üret */
        policeTimer++;

        if (
            policeTimer >=
            difficultySettings[difficulty].policeDelay
        ) {

            policeTimer = 0;

            createPolice();
        }


        /* Trafik hareketi */

        traffic.forEach((car, index) => {

            let top =
                parseInt(car.style.top);

            top += gameSpeed;

            car.style.top =
                top + "px";

            if (collision(player, car)) {

                car.remove();

                traffic.splice(index, 1);

                loseLife();

                return;
            }

            if (top > window.innerHeight) {

                car.remove();

                traffic.splice(index, 1);
            }

        });


        /* Polis hareketi */

        police.forEach((car, index) => {

            let top =
                parseInt(car.style.top);

            top += gameSpeed + 0.5;

            car.style.top =
                top + "px";

            if (collision(player, car)) {

                car.remove();

                police.splice(index, 1);

                loseLife();

                return;
            }

            if (top > window.innerHeight) {

                car.remove();

                police.splice(index, 1);
            }

        });


        /* Zamanla oyun zorlaşır */

        gameSpeed += 0.0008;

    }

    animationId =
        requestAnimationFrame(gameLoop);
}


/* =========================
   SOLA GİT
========================= */

function moveLeft() {

    if (!playing || paused) {
        return;
    }

    if (playerLane > 0) {

        playerLane--;

        player.style.left =
            lanes[playerLane] + "px";
    }
}


/* =========================
   SAĞA GİT
========================= */

function moveRight() {

    if (!playing || paused) {
        return;
    }

    if (playerLane < 2) {

        playerLane++;

        player.style.left =
            lanes[playerLane] + "px";
    }
}


/* =========================
   KLAVYE
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {
            moveLeft();
        }

        if (event.key === "ArrowRight") {
            moveRight();
        }

    }
);


/* =========================
   DEVAM ET
========================= */

function continueGame() {

    celebration.style.display =
        "none";

    paused = false;

    startScoreSystem();
}


/* =========================
   OYUN BİTTİ
========================= */

function endGame() {

    playing = false;

    paused = true;

    if (scoreTimer) {

        clearTimeout(scoreTimer);

        scoreTimer = null;
    }

    cancelAnimationFrame(animationId);

    finalScore.textContent =
        score;

    gameOverScreen.style.display =
        "flex";
}


/* =========================
   TEKRAR OYNA
========================= */

function restartGame() {

    gameOverScreen.style.display =
        "none";

    startGame(difficulty);
}


/* =========================
   MENÜYE DÖN
========================= */

function backToMenu() {

    playing = false;

    paused = true;

    if (scoreTimer) {

        clearTimeout(scoreTimer);

        scoreTimer = null;
    }

    cancelAnimationFrame(animationId);

    document.querySelectorAll(
        ".traffic, .police"
    ).forEach(car => car.remove());

    gameOverScreen.style.display =
        "none";

    celebration.style.display =
        "none";

    menu.style.display =
        "flex";
}

</script>

</body>
</html>
